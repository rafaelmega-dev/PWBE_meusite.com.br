<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Eu Amo a Vitória 💖</title>
    <style>
        /* Fundo animado degradê */
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Comic Sans MS', cursive, sans-serif;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4, #fbc2eb, #a6c1ee);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            overflow: hidden;
        }

        @keyframes gradientBG {
            0% {background-position: 0% 50%;}
            50% {background-position: 100% 50%;}
            100% {background-position: 0% 50%;}
        }

        /* Container central */
        .container {
            text-align: center;
            color: #fff;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.3);
        }

        h1 {
            font-size: 4em;
            margin-bottom: 20px;
            position: relative;
        }

        /* Animação dos corações */
        .heart {
            position: absolute;
            width: 20px;
            height: 20px;
            background-color: #ff4d6d;
            transform: rotate(-45deg);
            animation: float 5s linear infinite;
        }

        .heart::before,
        .heart::after {
            content: "";
            position: absolute;
            width: 20px;
            height: 20px;
            background-color: #ff4d6d;
            border-radius: 50%;
        }

        .heart::before {
            top: -10px;
            left: 0;
        }
        .heart::after {
            left: 10px;
            top: 0;
        }

        @keyframes float {
            0% {transform: translateY(0) rotate(-45deg); opacity: 1;}
            100% {transform: translateY(-600px) rotate(-45deg); opacity: 0;}
        }

        /* Corações espalhados aleatoriamente */
        .hearts-container {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        /* Mensagem estilizada */
        p {
            font-size: 2em;
            color: #fff;
            text-shadow: 1px 1px 5px rgba(0,0,0,0.5);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% {transform: scale(1);}
            50% {transform: scale(1.1);}
            100% {transform: scale(1);}
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>💖 Eu Amo a Vitória 💖</h1>
        <p>Você é incrível! 🌟</p>
    </div>

    <div class="hearts-container">
        <!-- Geração de corações -->
        <script>
            const container = document.querySelector('.hearts-container');
            for(let i=0; i<30; i++){
                const heart = document.createElement('div');
                heart.classList.add('heart');
                heart.style.left = Math.random() * 100 + '%';
                heart.style.animationDuration = (3 + Math.random()*3) + 's';
                heart.style.width = (15 + Math.random()*20) + 'px';
                heart.style.height = heart.style.width;
                heart.style.top = (Math.random() * window.innerHeight) + 'px';
                container.appendChild(heart);
            }
        </script>
    </div>
</body>
</html>
